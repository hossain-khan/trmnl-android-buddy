        required: true
  /api/apps/fleet/{installation_id}/alerts:
    parameters:
      - name: installation_id
        in: path
        description: Fleet installation id
        required: true
        schema:
          type: string
    patch:
      summary: Change the overdue check-in alert
      tags:
        - Apps - Fleet
      operationId: updateFleetAlerts
      description: One email digest when a member is overdue by the threshold. Keys
        left out keep their value; a null email sends the digest to the account
        owner.
      security:
        - bearer_auth: [ ]
      parameters: [ ]
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Fleet"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Installation belongs to another user
        "422":
          description: A threshold the alert does not offer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                overdue_alert_enabled:
                  type: boolean
                overdue_alert_threshold_minutes:
                  type: integer
                  enum:
                    - 30
                    - 60
                    - 240
                overdue_alert_email:
                  type: string
                  nullable: true
        required: true
