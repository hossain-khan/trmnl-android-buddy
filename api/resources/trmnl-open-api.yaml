  /api/devices/{device_id}/logs:
    get:
      summary: Read the logs of a device
      tags:
        - Devices
      operationId: getDeviceLogs
      description: What the device reported and what rendering for it logged, newest
        first. before_ts and before_event_id from the last row page further
        back.
      security:
        - bearer_auth: [ ]
      parameters:
        - name: device_id
          in: path
          required: true
          description: Device id
          schema:
            type: integer
        - name: level
          in: query
          required: false
          enum:
            - debug
            - info
            - warn
            - error
          schema:
            type: string
          description: ":

            \ * `debug`\ 

            \ * `info`\ 

            \ * `warn`\ 

            \ * `error`\ 

            \ "
        - name: source
          in: query
          required: false
          enum:
            - device
            - plugin
            - custom_plugin
            - private_plugin
            - mashup
            - support
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 1 to 100, default 20
          schema:
            type: integer
        - name: before_ts
          in: query
          required: false
          schema:
            type: string
        - name: before_event_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Scopes the query to the device within the account
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      logs:
                        type: array
                        items:
                          type: object
                      more:
                        type: boolean
                      oldest_cursor:
                        type: object
                        nullable: true
                        properties:
                          ts:
                            type: string
                          event_id:
                            type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Device belongs to another user
        "422":
          description: A level the logs do not have
  /api/devices/{device_id}/mashups:
    post:
      summary: Add a mashup to a device playlist
      tags:
        - Mashups
      operationId: createDeviceMashup
      description: Splits one screen between plugin settings. getDevice lists the
        layouts the device can show and the positions each layout has. The 1x1
        layout adds a plain playlist item instead of a mashup.
      security:
        - bearer_auth: [ ]
      parameters:
        - name: device_id
          in: path
          required: true
          description: Device id
          schema:
            type: integer
