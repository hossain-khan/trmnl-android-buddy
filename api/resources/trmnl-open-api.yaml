  /api/devices/{id}:
    parameters:
      - name: id
        in: path
        description: Device ID
        required: true
        schema:
          type: integer
    get:
      summary: Get the data of a device
      tags:
        - Devices
      operationId: getDevice
      security:
        - bearer_auth: [ ]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Device"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Update a device
      tags:
        - Devices
      operationId: updateDevice
      description: The same settings as the device page. Keys the device cannot take
        (custom dimensions on a fixed-size model, appearance on a native device)
        are dropped; a native device can only switch between the OG models.
      parameters: [ ]
      security:
        - bearer_auth: [ ]
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Device"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: An appearance change renders every playlist item again, past the
            hourly render allowance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Kitchen TRMNL
                refresh_interval:
                  type: integer
                  example: 900
                  description: Seconds between check-ins, 300 to 86400
                orientation:
                  type: integer
                  example: 0
                sleep_mode_enabled:
                  type: boolean
                  example: true
                sleep_screen_enabled:
                  type: boolean
                  example: true
                sleep_start_time:
                  type: integer
                  example: 1320
                  description: Minutes after midnight, 0 to 1439
                sleep_end_time:
                  type: integer
                  example: 480
                  description: Minutes after midnight, 0 to 1439
                sleep_until:
                  type: string
                  nullable: true
                  example: 2026-10-01T17:00
                  description: Sleep once, from the next check-in until this ISO 8601 time (at
                    most a year out); no offset means the account time zone,
                    null cancels. Any later check-in, such as a button press,
                    wakes the device
                ota_enabled:
                  type: boolean
                  example: true
                low_battery_notification_enabled:
                  type: boolean
                  example: true
                low_battery_notification_email:
                  type: string
                  nullable: true
                low_battery_screen_disabled:
                  type: boolean
                percent_charged:
                  type: number
                  example: 69
                visibility:
                  type: string
                  enum:
                    - standalone
                    - sharable
                model_id:
                  type: integer
                  description: listModels; a BYOD device can take any model
                firmware_channel:
                  type: string
                  enum:
                    - development
                    - test
                    - staging
                    - production
                special_function:
                  type: string
                  nullable: true
                touchbar_mode:
                  type: string
                  enum:
                    - tap
                    - swipe
                temperature_profile:
                  type: string
                  enum:
                    - default
                    - a
                    - b
                waits_for_next_render:
                  type: boolean
                refreshing_screen_disabled:
                  type: boolean
                maximum_compatibility:
                  type: boolean
                guest_mode_item_id:
                  type: integer
                  nullable: true
                guest_mode_item_duration:
                  type: integer
                  nullable: true
                palette_id:
                  type: string
                  example: bw
                  description: listPalettes
                font_family:
                  type: string
                  example: classic
                text_scale:
                  type: string
                  enum:
                    - small
                    - regular
                    - large
                    - xlarge
                theme:
                  type: string
                playlist_item_ttl:
                  type: integer
                  nullable: true
                  enum:
                    - 24
                    - 48
                    - 72
                    - 96
                    - 120
                    - 144
                    - 168
                  description: Hours a playlist item can go without a new screen before it is
                    skipped; null never skips
                custom_width:
                  type: integer
                  description: byod_custom model only
                custom_height:
                  type: integer
                  description: byod_custom model only
                custom_format:
                  type: string
                  description: byod_custom model only
                framework_size:
                  type: string
                  enum:
                    - sm
                    - md
                    - lg
                  description: byod_custom model only
                maximum_image_bytes:
                  type: integer
                  description: byod_custom model only
                dither_pixel_ratio:
                  type: number
                  description: byod_custom model only
                scale_factor:
                  type: number
                  description: BYOD only
                ui_scale:
                  type: number
                  description: BYOD only
                rotate:
                  type: integer
