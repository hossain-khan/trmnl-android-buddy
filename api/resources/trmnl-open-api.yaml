                      col:
                        type: integer
                      row:
                        type: integer
                      cs:
                        type: integer
                      rs:
                        type: integer
                contents:
                  type: object
                  additionalProperties:
                    type: integer
                  description: Plugin setting id by position; a position left out renders empty
              required:
                - layout
                - contents
        required: true
