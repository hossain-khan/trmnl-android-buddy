              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/RoomBookingIntegration"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Integration of another type
        "422":
          description: The provider could not be read
        "429":
          description: The account has had its hourly syncs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/apps/room_booking/{installation_id}/integrations/{integration_type}/{id}:
    parameters:
      - name: installation_id
        in: path
        description: Room booking installation id
        required: true
        schema:
          type: string
      - name: integration_type
        in: path
        enum:
          - google_user
          - google_workspace
          - microsoft_user
          - microsoft_workspace
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: Integration id
        required: true
        schema:
          type: integer
    patch:
      summary: Choose the calendars of an account to sync, and its workspace settings
      tags:
        - Apps - Room Booking
      operationId: updateRoomBookingIntegration
      description: "calendar_ids, when given, is the whole set to sync: a calendar
        left out stops syncing and leaves every screen and collection. The ids
        are the numbers of the account's calendars, from
        listRoomBookingCalendars without the kind prefix.
        booking_organizer_email and parking_resource_group_id apply to a
        Microsoft workspace and are verified against Graph."
      security:
        - bearer_auth: [ ]
      parameters: [ ]
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/RoomBookingIntegration"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
