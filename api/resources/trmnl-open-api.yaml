                      method:
                        type: string
                      integrations_url:
                        type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not an integration type
  /api/apps/room_booking/{installation_id}/integrations/{integration_type}/{id}/syncs:
