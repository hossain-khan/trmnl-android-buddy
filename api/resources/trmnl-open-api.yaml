          description: "Why the wait is what it is: asleep, or the schedule or render that
            moved it"
        refresh_seconds:
          type: integer
          description: How long the device waits before its next check-in
        refresh_rate_seconds:
          type: integer
          description: The wait before the next-render extension
        render_at:
          type: string
          format: date_time
          nullable: true
          description: When the shown content renders next
        render_reason:
          type: string
          nullable: true
          description: Why no render is scheduled
        waits_past_refresh_rate:
          type: boolean
          description: The device is held past its refresh rate by the "waits for next
            render" setting
    Timeline:
      type: object
      properties:
        date:
          type: string
          format: date
          description: The day shown, in the owner’s time zone
        today:
          type: string
          format: date
          description: Today in the owner’s time zone; expected and strip are empty on any
            other day
        zone:
          type: string
          example: America/New_York
        available:
          type: boolean
          description: Telemetry is configured; recorded is empty when it is not
        query_failed:
          type: boolean
          description: Telemetry could not be read for this request; recorded is empty
        truncated:
          type: boolean
          description: The day had more events than one page holds (1000)
        check_in:
          type: object
          nullable: true
          description: Whether the device checked in when it said it would; null for a
            plugin setting or mashup
          properties:
            state:
              type: string
              enum:
                - never_seen
                - overdue
                - asleep
                - on_time
            expected_at:
              type: string
              format: date_time
              nullable: true
        recorded:
          type: array
          description: The day’s check-ins and what they caused, oldest first, one entry
            per check-in
          items:
            type: object
            properties:
              at:
                type: string
                format: date_time
              name:
                type: string
                nullable: true
                description: The source shown on a device timeline; the device on a plugin
                  setting or mashup timeline
              outcome:
                type: string
                nullable: true
                description: What the check-in decided
              leading:
                type: object
                description: "The event that names the entry: serve, render, checkin or
                  schedule; ts and refresh_at_after in the owner’s time zone,
                  ids as integers"
              supporting:
                type: array
                items:
                  type: object
                description: The other events of the same check-in, in the same shape as leading
              trace_entries:
                type: array
                items:
                  type: object
                description: The decisions the check-in recorded
        expected:
          type: array
          items:
            $ref: "#/components/schemas/TimelineStep"
          description: The coming check-ins over the next 24 hours; across every device
            for a plugin setting or mashup
        strip:
          type: array
          items:
            $ref: "#/components/schemas/TimelineStep"
          description: A device’s whole rotation over the next hours, unfiltered by
            source; empty for a plugin setting or mashup
