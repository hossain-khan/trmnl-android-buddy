      type: object
      additionalProperties: false
      description: Every key is optional; an omitted key keeps the framework default.
        A value outside the vocabulary (an unrecognized token, surface, hue, or
        advanced channel) answers 422; a key the recipe does not read is
        ignored, not rejected.
      properties:
        font:
          type: string
          nullable: true
          description: A FontPack id such as "bitter" or "space-mono", or blank for the
            device font
        chip:
          type: string
          enum:
            - filled
            - outlined
        screen_scale:
          type: string
          description: '"none", "invert", or a hue side like "red-dark"/"red-bright"'
        surfaces:
          type: object
          additionalProperties:
            type: string
          description: paper, text, muted_text, strong_fill, soft_fills, borders,
            title_bar, progress, dividers — each a color token ("black",
            "white", "gray-30", "red-40", ...) or "hidden" for dividers
        remap:
          type: object
          properties:
            grays:
              type: string
              description: '"keep", "invert", a hue side, "<hue>-linear", or any color token'
            colors:
              type: object
              additionalProperties:
                type: string
              description: "target token per hue: red, orange, yellow, lime, green, cyan,
                blue, violet, purple, pink"
        layout:
          type: object
          properties:
            whitespace:
              type: string
              enum:
                - compact
                - regular
                - airy
                - spacious
            corners:
              type: string
              enum:
                - sharp
                - regular
                - round
            title_bar_height:
              type: string
              enum:
                - slim
                - regular
                - tall
            progress:
              type: string
              enum:
                - slim
                - regular
                - thick
        typography:
          type: object
          additionalProperties:
            type: string
          description: weight ("light"/"regular"/"medium"/"bold"), plus <role>_case
            ("as-written"/"uppercase"/"lowercase") and <role>_tracking
            ("normal"/"wide"/"wider") for title, value, label, description,
            title_bar, title_bar_instance, table_head (table_body has no _case)
        spacing:
          type: object
          properties:
            title_bar_padding:
              type: string
              enum:
                - flush
                - regular
                - wide
            item_padding:
              type: string
              enum:
                - none
                - small
                - regular
                - large
        title_bar:
          type: object
          description: ink, instance, stroke, instance_stroke — a color token, or
            "auto"/"inherit"
          additionalProperties:
            type: string
        item:
          type: object
          properties:
            fill:
              type: string
              description: '"none", "ramp", or a color token'
            border:
              type: string
              enum:
                - none
                - outline
                - corner-brackets
            ink:
              type: string
              description: '"auto" or a color token'
        advanced:
          type: object
          additionalProperties: true
          description: 'Framework contract channels and slots restated on one token, e.g.
            { "channels": { "canvas": "black" } }. Also accepted as the same
            mapping written as YAML text.'
