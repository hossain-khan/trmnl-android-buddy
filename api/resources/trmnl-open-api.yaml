    post:
      summary: Resync a mirrored device with its master
      tags:
        - Devices
      operationId: resyncDeviceMirror
      description: Copies playlist items the master has added since the device last
        synced. Only playlist items are copied automatically otherwise; use this
        after adding new content to the master.
      security:
        - bearer_auth: [ ]
      parameters:
        - name: device_id
          in: path
          required: true
          description: Device id
          schema:
            type: integer
      responses:
        "200":
          description: Resynced
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Device belongs to another user
  /api/devices/{device_id}/playlist_copies:
    post:
      summary: Copy a playlist to another device
      tags:
        - Playlists
      operationId: copyDevicePlaylist
      description: Appends items in source order without removing existing target
        items. Preserves appearance, priority, and schedules. Plugin instances
        are shared; mashups are copied. Existing setup placeholders for the same
        plugin are skipped. Both devices must belong to your account. Repeating
        this request adds the configured items again. Refreshes are queued after
        copying.
      security:
        - bearer_auth: [ ]
      parameters:
        - name: device_id
          in: path
          required: true
          description: Source device id
          schema:
            type: integer
      responses:
        "200":
          description: Playlist copied and refreshes queued
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - success
                    properties:
                      success:
                        type: boolean
        "400":
          description: Destination device id is missing or is not a scalar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Source or destination device not found in your account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
