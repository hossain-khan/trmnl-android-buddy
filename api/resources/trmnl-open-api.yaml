              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PluginInstallation"
        "201":
          description: Created installation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PluginInstallation"
        "409":
          description: Idempotency key conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationError"
