      summary: Disconnect an account
      tags:
        - Apps - Room Booking
      operationId: disconnectRoomBookingIntegration
      description: Forgets the credentials and removes the account's calendars from
        every screen and collection.
      security:
        - bearer_auth: [ ]
      responses:
        "204":
          description: Disconnected
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Integration belongs to another installation
