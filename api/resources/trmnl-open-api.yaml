      properties:
        id:
          type: integer
        name:
          type: string
          example: First Floor
        collection_type:
          type: string
          enum:
            - any
            - rooms
            - spaces
            - desks
            - desk_pools
            - parking_spaces
            - vehicles
            - equipment
            - people
            - other
        display_layout:
          type: string
          enum:
            - list
            - grid
        show_booking_qr:
          type: boolean
        resource_ids:
          type: array
          items:
            type: string
          example:
            - ical:12
            - google:3
          description: The calendars in it
        bound_device_ids:
          type: array
          items:
            type: integer
          description: Devices showing this collection
        public_booking_token:
          type: string
          nullable: true
        public_booking_url:
          type: string
          nullable: true
    RoomBookingSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Booking
        timezone:
          type: string
          nullable: true
        configured:
          type: boolean
          description: An account is connected or a calendar exists
        connected_accounts:
          type: object
          properties:
            google_user:
              type: integer
            google_workspace:
              type: integer
            microsoft_user:
              type: integer
            microsoft_workspace:
              type: integer
        calendar_count:
          type: integer
        collection_count:
          type: integer
        sync_error_count:
          type: integer
          description: Calendars whose last fetch failed
        device_ids:
          type: array
          items:
            type: integer
          description: Devices showing a calendar or collection
        billing:
          type: object
          properties:
            locked:
              type: boolean
              description: Changes answer 402 until the subscription is settled
            subscription_required:
              type: boolean
              description: Rooms reach a screen but nothing is subscribed yet
            subscription_status:
              type: string
              nullable: true
              example: active
            billing_url:
              type: string
              description: Where the owner subscribes or manages the subscription, in the
                browser
    RoomBookingSettings:
      type: object
      additionalProperties: false
      properties:
        timezone:
          type: string
          nullable: true
          example: Europe/Amsterdam
        public_bookings:
          type: boolean
          description: Walk-up QR booking
        dark_mode:
          type: boolean
        show_company_logo:
          type: boolean
        daily_public_booking_url_rotation:
          type: boolean
        time_format:
          type: string
          nullable: true
          enum:
            - null
            - 24_hour
            - 12_hour
          description: null detects it from the time zone
        walk_up_calendar:
          type: boolean
        walk_up_booking_window_days:
          type: integer
          enum:
            - 1
            - 2
            - 7
            - 30
        company_logo_attached:
          type: boolean
        color_company_logo_attached:
          type: boolean
    RoomBookingIntegration:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        integration_type:
          type: string
          enum:
            - google_user
            - google_workspace
            - microsoft_user
            - microsoft_workspace
        provider:
          type: string
          enum:
            - google
            - microsoft
        workspace:
          type: boolean
          description: An admin connection to a whole workspace, not one person's account
        label:
          type: string
          nullable: true
          example: owner@gmail.com
          description: The account email, or the workspace domain
        admin_email:
          type: string
          nullable: true
          description: Workspaces only
        booking_organizer_email:
          type: string
          nullable: true
          description: "Microsoft workspaces only: the mailbox bookings are made from"
        parking_resource_group_id:
          type: string
          nullable: true
          description: Microsoft workspaces only
        calendar_count:
          type: integer
        selected_calendar_count:
          type: integer
          description: Calendars selected for sync, the ones listRoomBookingCalendars shows
        last_synced_at:
          type: string
          format: date_time
          nullable: true
        last_attempted_at:
          type: string
          format: date_time
          nullable: true
    PublicBookingEvent:
      type: object
      additionalProperties: false
      description: "The shape the walk-up page uses: times are local to the room,
        without a zone"
      properties:
        id:
          type: integer
        title:
          type: string
        startsAt:
          type: string
          example: 2026-06-12T10:00
        endsAt:
          type: string
          example: 2026-06-12T11:00
        actionLabel:
          type: string
          description: Present when the visitor may cancel or end it
        actionMethod:
          type: string
          enum:
            - delete
            - patch
        actionPath:
          type: string
          example: /api/book/{token}/bookings/12
        actionConfirm:
          type: string
    RoomBookingBilling:
      type: object
      additionalProperties: false
      properties:
        locked:
          type: boolean
          description: Changes answer 402 until the subscription is settled
        subscription_required:
          type: boolean
          description: Calendars reach a screen but nothing is subscribed yet
        billable_resource_count:
          type: integer
          description: Calendars on a screen, directly or through a collection
        amount_in_dollars:
          type: object
          properties:
            month:
              type: integer
              example: 8
            year:
              type: integer
              example: 80
          description: Per calendar
        trial_days:
          type: integer
          example: 14
        grace_until:
          type: string
          format: date_time
          nullable: true
        subscription:
          type: object
          nullable: true
          properties:
            id:
              type: string
            status:
              type: string
              example: active
            interval:
              type: string
              enum:
                - month
                - year
            billed_quantity:
              type: integer
        checkout_url:
          type: string
          description: The billing page, where the owner subscribes in the browser
        portal_url:
          type: string
          nullable: true
          description: The billing page, where a subscribed owner opens the Stripe portal
    RoomBookingDeviceScreen:
      type: object
      additionalProperties: false
      description: A device showing a calendar or a collection, and the image it is showing
      properties:
        device_id:
          type: integer
        device_name:
          type: string
          example: Boardroom display
        screen:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Screen"
          description: null while that device has not rendered this calendar or collection
            yet
    RoomBookingCalendarDetails:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          example: ical:12
          description: '"<kind>:<number>", the id every calendar operation takes'
        kind:
          type: string
          enum:
            - ical
            - google
            - microsoft
        name:
          type: string
          example: Boardroom
        timezone:
          type: string
          example: Europe/Amsterdam
        capacity:
          type: integer
          nullable: true
        show_booking_qr:
          type: boolean
        feed_backed:
          type: boolean
          description: "Read-only feed: bookings are made in the source calendar, not here"
        ics_url:
          type: string
          nullable: true
          description: iCal calendars only
        resource_kind:
          type: string
          nullable: true
          example: room
          description: Google and Microsoft calendars only
        booking_mode:
          type: string
          nullable: true
          enum:
            - null
            - reservable
            - on_demand
            - unavailable
          description: Google and Microsoft calendars only
        last_synced_at:
          type: string
          format: date_time
          nullable: true
        last_sync_error:
          type: string
          nullable: true
        bound_device_ids:
          type: array
          items:
            type: integer
          description: Devices showing this calendar
        public_booking_token:
          type: string
          nullable: true
          description: Walk-up QR booking token, when walk-up booking is open
        public_booking_url:
          type: string
          nullable: true
        current_booking:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RoomBooking"
        upcoming_bookings:
          type: array
          items:
            $ref: "#/components/schemas/RoomBooking"
