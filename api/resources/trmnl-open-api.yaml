          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PlaylistItem"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Device belongs to another user
        "422":
          description: A layout that does not exist
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                layout:
                  type: string
                  enum:
                    - 1x1
                    - 1Tx1B
                    - 1Lx1R
                    - 1Tx2B
                    - 2Tx1B
                    - 1Lx2R
                    - 2Lx1R
                    - 2x2
                    - 3x3
                  description: One of the layouts getDevice lists for the device
                grid_config:
                  type: array
                  nullable: true
                  description: The cells of a 3x3 layout only
                  items:
