          description: Installation belongs to another user
        "422":
          description: Graph cannot verify the organizer mailbox
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                calendar_ids:
                  type: array
                  items:
                    type: integer
                booking_organizer_email:
                  type: string
                  nullable: true
                parking_resource_group_id:
                  type: string
                  nullable: true
        required: true
