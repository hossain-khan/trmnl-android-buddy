    post:
      summary: Claim an unclaimed device
      tags:
        - Devices
      operationId: claimDevice
      description: Links a device that has not been claimed yet (a new device, or a QR
        code scan) to this account. Sets up the starter playlist item the first
        time. friendly_id is printed on the device screen during setup.
      security:
        - bearer_auth: [ ]
      parameters: [ ]
      responses:
        "200":
          description: Claimed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Device"
        "400":
          description: friendly_id is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: A concurrent claim already took the device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many failed claims from this account or address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                friendly_id:
                  type: string
                  description: The code shown on the device during setup
              required:
                - friendly_id
        required: true
    get:
      summary: List my devices
      tags:
        - Devices
      operationId: listDevices
      security:
        - bearer_auth: [ ]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Device"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/devices/{device_id}/coverage:
    get:
      summary: Times of the week a device's playlist shows nothing scheduled
      tags:
        - Devices
      operationId: getDevicePlaylistCoverage
      description: Windows carry minutes since midnight in the account timezone, end
        inclusive.
      security:
        - bearer_auth: [ ]
      parameters:
        - name: device_id
          in: path
          required: true
          description: Device id
          schema:
            type: integer
      responses:
        "200":
          description: The gaps in the schedule
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      gaps:
                        type: array
                        items:
                          type: object
                          properties:
                            week_days:
                              type: array
                              items:
                                type: integer
                              description: 0 is Sunday through 6 is Saturday
                            covered:
                              type: array
                              items:
                                type: array
                                items:
                                  type: integer
                              description: "[start_minute, end_minute] windows the playlist shows"
                            uncovered:
                              type: array
                              items:
                                type: array
                                items:
                                  type: integer
                              description: "[start_minute, end_minute] windows nothing is scheduled"
                      period_count:
                        type: integer
                        description: How many uncovered windows across the week
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Device belongs to another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/devices/{device_id}/firmware_update_retries:
    post:
      summary: Retry a stalled firmware update
      tags:
        - Devices
      operationId: retryDeviceFirmwareUpdate
      description: Clears the backoff on a device stuck on an available firmware
        update, so the next check-in offers it again.
      security:
        - bearer_auth: [ ]
      parameters:
        - name: device_id
          in: path
          required: true
          description: Device id
          schema:
            type: integer
      responses:
        "200":
          description: Backoff cleared
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Device belongs to another user
  /api/devices/{device_id}/forecast:
    get:
      summary: Simulate a device's coming check-ins, deciding each one the way a real
        check-in would
      tags:
        - Devices
      operationId: getDeviceForecast
      description: Simulates upcoming check-ins without writing anything. reason
        explains a step's wait (e.g. asleep, or an extended refresh rate).
      security:
        - bearer_auth: [ ]
      parameters:
        - name: device_id
          in: path
          required: true
          description: Device id
          schema:
            type: integer
        - name: hours
          in: query
          required: false
          description: How far ahead to simulate, 1 to 48. Defaults to 24
          schema:
            type: integer
      responses:
        "200":
          description: The simulated steps
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      steps:
                        type: array
                        items:
                          type: object
                          properties:
                            at:
                              type: string
                              format: date_time
                              description: When this simulated check-in happens
                            playlist_item_id:
                              type: integer
                              nullable: true
                            plugin_setting_id:
                              type: integer
                              nullable: true
                            name:
                              type: string
                              nullable: true
                              description: The plugin setting or mashup showing at this step
                            refresh_seconds:
                              type: integer
                              description: Seconds until the following step, after any extension
                            refresh_rate_seconds:
                              type: integer
                              description: The item's own wake interval, before extension
                            reason:
                              type: string
                              nullable: true
                              description: Why the wait is what it is, e.g. asleep or an extended refresh rate
                            render_at:
                              type: string
                              format: date_time
                              nullable: true
                              description: When the next render is predicted to land, if any
                            render_reason:
                              type: string
                              nullable: true
                              description: Why no render is predicted, when render_at is null
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Device belongs to another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/devices/{device_id}/identification:
    post:
      summary: Identify a device
      tags:
        - Devices
      operationId: identifyDevice
      description: Requests a screen showing the device friendly ID. Rendering runs in
        the background. The device receives the screen when it next checks in;
        this does not wake a sleeping device.
      security:
        - bearer_auth: [ ]
      parameters:
        - name: device_id
          in: path
          required: true
          description: Device id
          schema:
            type: integer
      responses:
        "202":
          description: Identification requested
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - success
                    properties:
                      success:
                        type: boolean
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Device not found in your account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Device could not be updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/devices/{device_id}/mirror:
    post:
      summary: Point a device at another device's shared playlist
      tags:
        - Devices
      operationId: mirrorDevice
      description: Mirroring copies the master device's sharable playlist onto this
        device. The master must have visibility set to sharable.
      security:
        - bearer_auth: [ ]
      parameters:
        - name: device_id
          in: path
          required: true
          description: Device id
          schema:
            type: integer
      responses:
        "200":
          description: Mirroring the master
        "400":
          description: master_friendly_id is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Device belongs to another user
        "422":
          description: The friendly ID is not one this device can mirror
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                master_friendly_id:
                  type: string
                  description: friendly_id of the sharable device to mirror
              required:
                - master_friendly_id
        required: true
    delete:
      summary: Stop mirroring
      tags:
        - Devices
      operationId: stopMirroringDevice
      description: Clears the device's mirror. This is a DELETE on the mirror link,
        not on the device — the device keeps its own playlist history.
      security:
        - bearer_auth: [ ]
      parameters:
        - name: device_id
          in: path
          required: true
          description: Device id
          schema:
            type: integer
      responses:
        "204":
          description: Mirroring removed
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Device belongs to another user
