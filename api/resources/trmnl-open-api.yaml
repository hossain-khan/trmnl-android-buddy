        - bearer_auth: [ ]
      parameters:
        - name: item_id
          in: path
          required: true
          description: Playlist item id
          schema:
            type: integer
      responses:
        "200":
          description: An empty array clears the schedule, so the item always displays
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      week_schedules:
                        type: array
                        items:
                          type: object
                          properties:
                            week_days:
                              type: array
                              items:
                                type: integer
                              description: 0 is Sunday through 6 is Saturday
                            start_time:
                              type: string
                              example: 09:00
                            end_time:
                              type: string
                              example: 17:00
                      always_active:
                        type: boolean
                        example: false
                        description: True when no window is set, so the item always displays
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Playlist item belonging to another user
        "422":
          description: A time that is not HH:MM is refused
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                week_schedules:
                  type: array
                  items:
                    type: object
                    properties:
                      week_days:
                        type: array
                        items:
                          type: integer
                        description: 0 is Sunday through 6 is Saturday
                      start_time:
                        type: string
                        description: HH:MM, 00:00 to 23:59
                      end_time:
                        type: string
                        description: HH:MM, 00:00 to 23:59
              required:
                - week_schedules
        required: true
  /api/playlists/items:
    get:
      summary: List my playlist items
      tags:
        - Playlists
      operationId: listPlaylistItems
      security:
        - bearer_auth: [ ]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlaylistItem"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/playlists/items/{id}:
    patch:
      summary: Update a playlist item
      tags:
        - Playlists
      operationId: updatePlaylistItem
      description: The appearance fields override the device's own for this item; null
        returns one to the device default. listPalettes names the palettes a
        device model has.
      parameters:
        - name: id
          in: path
          description: ID of the playlist item
          required: true
          schema:
            type: integer
      security:
        - bearer_auth: [ ]
      responses:
        "200":
          description: item that is not an object is read as no change
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PlaylistItem"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: An appearance value the device cannot show
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                visible:
                  type: boolean
                palette_id:
                  type: string
                  nullable: true
                  example: bw
                font_family:
                  type: string
                  nullable: true
                  example: classic
                text_scale:
                  type: string
                  nullable: true
                  enum:
                    - small
                    - regular
                    - large
                    - xlarge
                    - null
                theme:
                  type: string
                  nullable: true
                  example: dark
    delete:
      summary: Remove a playlist item
      tags:
        - Playlists
      operationId: deletePlaylistItem
      parameters:
        - name: id
          in: path
          description: ID of the playlist item
          required: true
          schema:
            type: integer
      security:
        - bearer_auth: [ ]
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
                        example: true
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Playlist item belonging to another user
  /api/playlists/items/{id}/duplicates:
    post:
      summary: Duplicate a playlist item
      tags:
        - Playlists
      operationId: duplicatePlaylistItem
      description: Copies the plugin setting or mashup and places the copy on the same
        device.
      security:
        - bearer_auth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: Playlist item id
          schema:
            type: integer
      responses:
        "200":
          description: The new playlist item
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PlaylistItem"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Playlist item belongs to another user
        "422":
          description: A placeholder has nothing to copy until it is configured
  /api/plugin_settings/{id}/archive:
    parameters:
      - name: id
        in: path
        description: Plugin setting ID
        required: true
        schema:
          type: integer
    get:
      summary: Download a plugin setting archive
      tags:
        - Plugin Settings
      operationId: downloadPluginSettingArchive
      description: >
        Answers a zip, not JSON: settings.yml, one .liquid per markup size, and

        shared.liquid.


        This endpoint is available for unauthenticated requests.


        When unauthenticated, any published recipe may be archived.


        When authenticated, the requesting user's private plugins are also
        archivable.


        An archive of another user's recipe leaves polling_headers and
        polling_body empty.
      security:
        - bearer_auth: [ ]
      responses:
        "200":
          description: Success
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Upload a plugin setting archive
      tags:
        - Plugin Settings
      operationId: uploadPluginSettingArchive
      security:
        - bearer_auth: [ ]
      parameters: [ ]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PluginSettingArchive"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: file
        required: true
        description: Plugin setting archive file
  /api/plugin_settings/{plugin_setting_id}/configuration/evaluation:
    post:
      summary: Evaluate a typed draft without saving
      tags:
        - Plugin Configuration
      operationId: evaluatePluginConfiguration
      security:
        - bearer_auth: [ ]
      parameters:
        - name: plugin_setting_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Evaluated configuration and safe field errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PluginConfiguration"
        "409":
          description: Configuration changed
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - revision
                - draft
              properties:
                revision:
                  type: string
                draft:
                  type: array
                  items:
                    $ref: "#/components/schemas/ConfigurationChange"
                  maxItems: 200
        required: true
  /api/plugin_settings/{plugin_setting_id}/configuration/choices/{resolver_id}:
    post:
      summary: Read owner-bound remote choices
      tags:
        - Plugin Configuration
      operationId: getPluginConfigurationChoices
      security:
        - bearer_auth: [ ]
      parameters:
        - name: plugin_setting_id
          in: path
          required: true
          schema:
            type: integer
        - name: resolver_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "404":
          description: Unknown resolver for owned target
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - revision
                - draft
              properties:
                revision:
                  type: string
                draft:
                  type: array
                  items:
                    $ref: "#/components/schemas/ConfigurationChange"
                  maxItems: 200
                query:
                  type: string
                  maxLength: 200
                  nullable: true
                cursor:
                  type: string
                  nullable: true
        required: true
  /api/plugin_settings/{plugin_setting_id}/configuration:
    get:
      summary: Read safe typed configuration
      tags:
        - Plugin Configuration
      operationId: getPluginConfiguration
      security:
        - bearer_auth: [ ]
      parameters:
        - name: plugin_setting_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Typed configuration with write-only secrets omitted
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/PluginConfiguration"
        "401":
          description: Account bearer token required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationError"
        "404":
          description: Absent or unowned instance
    patch:
      summary: Apply atomic typed changes
      tags:
        - Plugin Configuration
      operationId: updatePluginConfiguration
      security:
        - bearer_auth: [ ]
      parameters:
        - name: plugin_setting_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Configuration saved
        "409":
          description: Stale revision
        "422":
          description: Invalid typed change; no fields saved
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigurationWrite"
        required: true
  /api/plugin_settings/custom_fields/verifications:
    post:
      summary: Check the custom fields YAML of a recipe
      tags:
        - Recipes
      operationId: verifyCustomFields
      description: Validates the YAML a recipe author writes under custom_fields, the
        form its installers fill in, without saving it. Each entry needs
        keyname, field_type and name.
      security:
        - bearer_auth: [ ]
      parameters: [ ]
      responses:
        "200":
          description: Valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      valid:
                        type: boolean
                      errors:
                        type: array
                        items:
                          type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: custom_fields that is not a string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                custom_fields:
                  type: string
                  description: The custom fields as a YAML list
              required:
                - custom_fields
        required: true
  /api/plugin_settings/{id}/data:
    parameters:
      - name: id
        in: path
        description: Plugin setting ID or UUID
        required: true
        schema:
          type: string
    get:
      summary: Get the data of a native plugin setting; a private plugin reads through
        getMergeVariables
      operationId: getPluginSettingData
      tags:
        - Plugin Settings
      security:
        - bearer_auth: [ ]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    description: The merge variables the instance currently renders from
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: A private or global plugin has no data endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Update data for a webhook plugin setting
      operationId: updatePluginSettingData
      tags:
        - Plugin Settings
      security:
        - bearer_auth: [ ]
      parameters: [ ]
      responses:
        "200":
          description: Success with UUID (no auth required)
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - merge_variables
                properties:
                  error:
                    type: string
                    nullable: true
                    description: Null when the write succeeded
                  merge_variables:
                    type: object
                    nullable: true
                    description: The variables now stored
                  processing:
                    type: string
                    example: serverless
                    description: Present when a transform runs out of band, so the variables are not
                      final
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Data cannot be modified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                merge_variables: { }
              required:
                - merge_variables
              additionalProperties: false
        required: true
        description: The value of `merge_variables` must be a JSON object
  /api/plugin_settings/{id}/featured_image:
    put:
      summary: Generate the marketplace preview image of a plugin setting
      tags:
        - Plugin Settings
      operationId: setPluginSettingFeaturedImage
      description: Queues a fresh render of the instance and attaches it as the image
        the recipe listing shows. Takes no body. One generation runs at a time
        per instance; a request while one runs is answered the same way and
        queues nothing.
      security:
        - bearer_auth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: Plugin setting id or uuid
          schema:
            type: string
      responses:
        "202":
          description: Generation queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - generating
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Plugin setting belongs to another user
    delete:
      summary: Remove the marketplace preview image of a plugin setting
      tags:
        - Plugin Settings
      operationId: removePluginSettingFeaturedImage
      description: Deletes the featured image; the recipe listing then shows a
        screenshot instead.
      security:
        - bearer_auth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: Plugin setting id or uuid
          schema:
            type: string
      responses:
        "204":
          description: Featured image removed
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Plugin setting belongs to another user
        "422":
          description: No featured image to remove
  /api/plugin_settings/{plugin_setting_id}/files:
    parameters:
      - name: plugin_setting_id
        in: path
        description: Plugin setting id
        required: true
        schema:
          type: integer
    get:
      summary: Read the files of a private plugin
      tags:
        - Plugin Settings
      operationId: getPluginSettingFiles
      description: "The archive downloadPluginSettingArchive zips, as text by
        filename: settings.yml and one .liquid per markup size. Any published
        recipe can be read; another author's recipe comes without its polling
        headers and body."
      security:
        - bearer_auth: [ ]
      responses:
        "200":
          description: Reads another author's published recipe without its secrets
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      files:
                        type: object
                        additionalProperties:
                          type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not the caller's and not a published recipe
        "422":
          description: A plugin type that has no files
    put:
      summary: Replace the files of a private plugin
      tags:
        - Plugin Settings
      operationId: importPluginSettingFiles
      description: The same files uploadPluginSettingArchive takes zipped, as text by
        filename. settings.yml is required; a markup file left out keeps its
        current content.
      security:
        - bearer_auth: [ ]
      parameters: [ ]
      responses:
        "200":
          description: Persists a settings-only import, with no markup file to save through
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PluginSettingArchive"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Plugin setting belongs to another user
        "422":
          description: settings.yml missing or malformed
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                files:
                  type: object
                  additionalProperties:
                    type: string
                  example:
                    settings.yml: |
                      ---
                      strategy: static
                      name: Mine
                    full.liquid: <div>{{ title }}</div>
              required:
                - files
        required: true
  /api/plugin_settings/{id}/image:
    parameters:
      - name: id
        in: path
        description: Plugin setting id or uuid
        required: true
        schema:
          type: string
    post:
      summary: Upload an image for a webhook_image plugin
      tags:
        - Plugin Settings
      operationId: uploadPluginSettingImage
      description: Send the image as JSON with the bytes in base64, or as the raw
        request body with its image Content-Type (not multipart form data). PNG,
        JPEG and WebP.
      parameters: [ ]
      responses:
        "200":
          description: Full-color image on a color device
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
        "401":
          description: Numeric id without an API key
        "404":
          description: Not found
        "422":
          description: Image too large
        "429":
          description: Rate limited
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                image_base64:
                  type: string
                  description: The image bytes, base64 encoded
              required:
                - image_base64
          image/png:
            schema:
              type: object
              properties:
                image_base64:
                  type: string
                  description: The image bytes, base64 encoded
              required:
                - image_base64
          image/jpeg:
            schema:
              type: object
              properties:
                image_base64:
                  type: string
                  description: The image bytes, base64 encoded
              required:
                - image_base64
          image/webp:
            schema:
              type: object
              properties:
                image_base64:
                  type: string
                  description: The image bytes, base64 encoded
              required:
                - image_base64
        required: true
  /api/plugin_settings/{plugin_setting_id}/logs:
    get:
      summary: Read plugin instance health and recent logs
      tags:
        - Plugin Settings - Logs
      operationId: getPluginSettingLogs
      security:
        - bearer_auth: [ ]
      parameters:
        - name: plugin_setting_id
          in: path
          required: true
          description: Plugin setting id or uuid
          schema:
            type: string
        - name: level
          in: query
          required: false
          enum:
            - debug
            - info
            - warn
            - error
          description: "Only return logs at this level:

            \ * `debug`\ 

            \ * `info`\ 

            \ * `warn`\ 

            \ * `error`\ 

            \ "
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum logs to return, 1 to 50. Defaults to 20
          schema:
            type: integer
      responses:
        "200":
          description: Accepts the integer id the listing returns, as well as the uuid
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      health:
                        type: object
                        properties:
                          state:
                            type: string
                            example: active
                          error_message:
                            type: string
                            nullable: true
                          error_retry_count:
                            type: integer
                            nullable: true
                            example: 0
                          last_refresh:
                            type: string
                            format: date_time
                            nullable: true
                          next_refresh:
                            type: string
                            format: date_time
                            nullable: true
                      logs_status:
                        type: string
                        enum:
                          - available
                          - unavailable
                        description: Unavailable when the log store cannot be read; logs is then empty
                      logs:
                        type: array
                        items:
                          type: object
                          properties:
                            event_id:
                              type: string
                              example: 11111111-1111-4111-8111-111111111111
                            ts:
                              type: string
                              example: 2026-09-05 12:00:00.000
                            level:
                              type: string
                              example: error
                            source:
                              type: string
                              nullable: true
                              example: private_plugin
                            dump:
                              type: array
                              nullable: true
                              items:
                                type: object
                                properties:
                                  m:
                                    type: string
                                description: 'One log line, shaped { m: "<level>, <timestamp>, <message>" }'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: UUID belonging to another user
        "422":
          description: A level the logs do not have
  /api/plugin_settings/{plugin_setting_id}/markup/{size}:
    get:
      summary: Read markup for a size
      tags:
        - Plugin Settings - Markup
      operationId: readMarkup
      security:
        - bearer_auth: [ ]
      parameters:
        - name: plugin_setting_id
          in: path
          required: true
          description: Plugin setting id or uuid
          schema:
            type: string
        - name: size
          in: path
          required: true
          description: Markup size
          schema:
            type: string
            enum:
              - markup_full
              - markup_half_horizontal
              - markup_half_vertical
              - markup_quadrant
              - markup_shared
              - tidbyt_canvas
              - transform_js
      responses:
        "200":
          description: Returns markup content
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      size:
                        type: string
                        example: markup_full
                      markup:
                        type: string
                        nullable: true
                        description: Null when nothing is attached at this size
                      shared_markup:
                        type: string
                        description: The markup_shared partial, returned alongside any other size that
                          has one
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: UUID belonging to another user
        "422":
          description: Invalid size
    put:
      summary: Write markup for a size
      tags:
        - Plugin Settings - Markup
      operationId: writeMarkup
      security:
        - bearer_auth: [ ]
      parameters:
        - name: plugin_setting_id
          in: path
          required: true
          description: Plugin setting id or uuid
          schema:
            type: string
        - name: size
          in: path
          required: true
          description: Markup size
          schema:
            type: string
            enum:
              - markup_full
              - markup_half_horizontal
              - markup_half_vertical
              - markup_quadrant
              - markup_shared
              - tidbyt_canvas
              - transform_js
      responses:
        "200":
          description: Markup written successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
                        example: true
                      size:
                        type: string
                        example: markup_full
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid size
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
              required:
                - content
        required: true
  /api/plugin_settings/{plugin_setting_id}/merge_variables:
    get:
      summary: Read the merge variables a plugin instance renders from
      tags:
        - Plugin Settings - Merge Variables
      operationId: getMergeVariables
      security:
        - bearer_auth: [ ]
      parameters:
        - name: plugin_setting_id
          in: path
          required: true
          description: Plugin setting id or uuid
          schema:
            type: string
      responses:
        "200":
          description: Infers the type of each variable held as static data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      strategy:
                        type: string
                        nullable: true
                        example: polling
                      variables:
                        description: The merge variables the instance renders from
                      schema:
                        description: Type inferred for each merge variable
                      global_variables:
                        description: trmnl.* variables, with sensitive settings masked
                      transform_raw_input:
                        description: Pre-transform input, present only when a transform is attached
                      transform_raw_input_schema:
                        description: Type inferred for each pre-transform variable
                      sensor_readings:
                        description: Present only when the owner has sensor readings
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: UUID belonging to another user
  /api/plugin_settings/{id}:
    patch:
      summary: Rename a plugin setting or change how it refreshes
      tags:
        - Plugin Settings
      operationId: updatePluginSetting
      description: Changes the attributes of the instance itself. Its form fields are
        updatePluginSettingFields, its markup writeMarkup. A refresh_interval
        faster than the plan allows is raised to the nearest allowed value.
      security:
        - bearer_auth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: Plugin setting id or uuid
          schema:
            type: string
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PluginSetting"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Plugin setting belongs to another user
        "422":
          description: Pushes nothing to GitHub when the save is refused
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                  nullable: true
                refresh_interval:
                  type: integer
                  enum:
                    - 1440
                    - 720
                    - 480
                    - 360
                    - 240
                    - 120
                    - 60
                    - 30
                    - 15
                    - 10
                    - 5
                  description: Minutes between renders
                health_notification_enabled:
                  type: boolean
                  description: Email the owner when the instance stops rendering
        required: true
    delete:
      summary: Delete a plugin setting
      tags:
        - Plugin Settings
      operationId: deletePluginSetting
      security:
        - bearer_auth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the plugin setting to delete
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/plugin_settings/{id}/copies:
    post:
      summary: Copy a plugin setting
      tags:
        - Plugin Settings
      operationId: copyPluginSetting
      description: Adds a new instance with the same settings and markup, named
        "[Copy] <name>", and answers it.
      security:
        - bearer_auth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: Plugin setting id or uuid
          schema:
            type: string
      responses:
        "200":
          description: The copy
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PluginSetting"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Plugin setting belongs to another user
        "422":
          description: The copy does not pass validation
  /api/plugin_settings/{id}/state_clears:
    post:
      summary: Clear the state a plugin setting has accumulated
      tags:
        - Plugin Settings
      operationId: clearPluginSettingState
      description: Forgets the trmnl.state a private plugin carries between renders.
        Its data and settings stay.
      security:
        - bearer_auth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: Plugin setting id or uuid
          schema:
            type: string
      responses:
        "204":
          description: State cleared
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Plugin setting belongs to another user
  /api/plugin_settings/{id}/credentials:
    delete:
      summary: Forget the linked account and remove the plugin setting
      tags:
        - Plugin Settings
      operationId: resetPluginSettingCredentials
      description: "Removes the OAuth credential the account holds for this plugin AND
        deletes the plugin setting, so the plugin can be set up again from
        scratch. Destructive: the setting is gone afterwards."
      security:
        - bearer_auth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: Plugin setting id or uuid
          schema:
            type: string
      responses:
        "204":
          description: Credential forgotten and setting removed
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Plugin setting belongs to another user
        "422":
          description: A published recipe cannot be removed
  /api/plugin_settings/{id}/debug_logs:
    post:
      summary: Turn on debug logs for a day
      tags:
        - Plugin Settings - Logs
      operationId: enablePluginSettingDebugLogs
      description: A private plugin then records the request and response of each
        fetch for 24 hours; read them with getPluginSettingLogs.
      security:
        - bearer_auth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: Plugin setting id or uuid
          schema:
            type: string
      responses:
        "200":
          description: Debug logs enabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      debug_logs_until:
                        type: string
                        format: date-time
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Plugin setting belongs to another user
        "422":
          description: Only a private plugin records debug logs
  /api/plugin_settings/{id}/health_resets:
    post:
      summary: Reset the health of a plugin setting that stopped rendering
      tags:
        - Plugin Settings
      operationId: resetPluginSettingHealth
      description: Clears the error count and puts the instance back on its render
        schedule. include_forks=true also resets every install of a recipe this
        setting publishes.
      security:
        - bearer_auth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: Plugin setting id or uuid
          schema:
            type: string
        - name: include_forks
          in: query
          required: false
          description: true also resets the installs of the recipe this setting publishes
          schema:
            type: boolean
      responses:
        "204":
          description: Health reset
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Plugin setting belongs to another user
  /api/plugin_settings/{id}/transform:
    delete:
      summary: Remove the transform script of a private plugin
      tags:
        - Plugin Settings - Markup
      operationId: removePluginSettingTransform
      description: Deletes the serverless transform file and forgets its language;
        renders then use the fetched data as is.
      security:
        - bearer_auth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: Plugin setting id or uuid
          schema:
            type: string
      responses:
        "204":
          description: Transform removed
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Plugin setting belongs to another user
        "422":
          description: The setting refuses to save
  /api/plugin_settings/{plugin_setting_id}/refreshes:
    post:
      summary: Refresh a plugin instance
      tags:
        - Plugin Settings - Refresh
      operationId: startRefresh
      description: A polling private plugin refetches its URL and answers a job_id to
        poll with getRefresh. Any other instance queues a render of its current
        data and answers without one.
      security:
        - bearer_auth: [ ]
      parameters:
        - name: plugin_setting_id
          in: path
          required: true
          description: Plugin setting id or uuid
          schema:
            type: string
      responses:
        "202":
          description: Queues a render for an instance that does not poll, such as a
            native plugin
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      job_id:
                        type: string
                        example: 3f1e...
                        description: Only for a polling instance
                      status:
                        type: string
                        enum:
                          - pending
                          - queued
                        example: pending
                      render_in_progress:
                        type: boolean
                        description: "Only for a render: another render already holds the instance"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: UUID belonging to another user
        "422":
          description: Instance has no polling URL
        "429":
          description: The account has used its hourly render allowance, shared with the
            dashboard and MCP
  /api/plugin_settings/{plugin_setting_id}/refreshes/{id}:
    get:
      summary: Read the result of a refresh
      tags:
        - Plugin Settings - Refresh
      operationId: getRefresh
      security:
        - bearer_auth: [ ]
      parameters:
        - name: plugin_setting_id
          in: path
          required: true
          description: Plugin setting id or uuid
          schema:
            type: string
        - name: id
          in: path
          required: true
          description: The job_id returned when the refresh was started
          schema:
            type: string
      responses:
        "200":
          description: Returns the freshly fetched variables
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      job_id:
                        type: string
                      status:
                        type: string
                        enum:
                          - complete
                        example: complete
                      success:
                        type: boolean
                        example: true
                      variables:
                        description: The merge variables the fetch returned
                      schema:
                        description: Type inferred for each merge variable
                      polling_url:
                        type: string
                        nullable: true
                      warning:
                        type: string
                        description: Present when the data is stale after a transform failure
                      logs:
                        type: array
                        items:
                          description: A log entry from the fetch
        "202":
          description: Refresh has not finished yet
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      job_id:
                        type: string
                        example: 3f1e...
                      status:
                        type: string
                        enum:
                          - pending
                        example: pending
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: UUID belonging to another user
        "410":
          description: Result aged out, or the job id was never issued
  /api/plugin_settings/{plugin_setting_id}/screenshots:
    post:
      summary: Start a preview render of a plugin instance
      tags:
        - Plugin Settings - Preview
      operationId: startPreview
      description: >
        Renders the instance so you can check its layout. The image comes back
        at reduced

        resolution and is not sized for a panel; a device is driven through
        /api/display.
      security:
        - bearer_auth: [ ]
      parameters:
        - name: plugin_setting_id
          in: path
          required: true
          description: Plugin setting id or uuid
          schema:
            type: string
      responses:
        "202":
          description: Renders one reduced image per request, however many the MCP tools
            batch at once
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      job_id:
                        type: string
                      status:
                        type: string
                        enum:
                          - pending
                        example: pending
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: UUID belonging to another user
        "422":
          description: Unknown device model
        "429":
          description: The account has used its hourly render allowance, shared with the
            dashboard and MCP
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                size:
                  type: string
                  example: markup_full
                  enum:
                    - markup_full
                    - markup_half_horizontal
                    - markup_half_vertical
                    - markup_quadrant
                device_model:
                  type: string
                  nullable: true
                  example: og
                  description: Device model keyname to render on. Omit for the standard preview
                    appearance
  /api/plugin_settings/{plugin_setting_id}/screenshots/{id}:
    get:
      summary: Read the result of a preview render
      tags:
        - Plugin Settings - Preview
      operationId: getPreview
      security:
        - bearer_auth: [ ]
      parameters:
        - name: plugin_setting_id
          in: path
          required: true
          description: Plugin setting id or uuid
          schema:
            type: string
        - name: id
          in: path
          required: true
          description: The job_id returned when the render was started
          schema:
            type: string
      responses:
        "200":
          description: Hands back the image the worker rendered
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      job_id:
                        type: string
                      status:
                        type: string
                        enum:
                          - complete
                        example: complete
                      preview_base64:
                        type: string
                        description: A reduced-resolution PNG for checking layout, not a device-ready
                          image
        "202":
          description: Render has not finished yet
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: UUID belonging to another user
        "410":
          description: Result aged out, or the job id was never issued
        "422":
          description: The render failed
  /api/plugin_settings/{plugin_setting_id}/settings:
    patch:
      summary: Update plugin settings fields
      tags:
        - Plugin Settings - Settings
      operationId: updatePluginSettingFields
      security:
        - bearer_auth: [ ]
      parameters:
        - name: plugin_setting_id
          in: path
          required: true
          description: Plugin setting id or uuid
          schema:
            type: string
      responses:
        "200":
          description: Settings updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
                        example: true
                      warnings:
                        type: array
                        items:
                          type: string
                        description: Fields that were written but are hidden under the current settings
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown UUID
        "422":
          description: Non-string field values
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fields:
                  type: object
              required:
                - fields
        required: true
  /api/plugin_settings:
    get:
      summary: List my plugin settings
      tags:
        - Plugin Settings
      operationId: listPluginSettings
      security:
        - bearer_auth: [ ]
      parameters:
        - name: plugin_id
          in: query
          required: false
          description: ID of a plugin or "calendars" to filter calendar plugins
          schema:
            type: string
      responses:
        "200":
          description: Returns all calendar plugin settings except Google Calendar
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PluginSetting"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a new plugin setting
      tags:
        - Plugin Settings
      operationId: createPluginSetting
      description: listPlugins gives the plugin_id to send here; getPlugin lists the
        fields to send updatePluginSettingFields next.
      security:
        - bearer_auth: [ ]
      parameters: [ ]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PluginSetting"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PluginSettingParams"
        required: true
  /api/plugin_settings/{id}/details:
    get:
      summary: Get plugin setting details
      tags:
        - Plugin Settings
      operationId: getPluginSettingDetails
      security:
        - bearer_auth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: Plugin setting id or uuid
          schema:
            type: string
      responses:
        "200":
          description: Returns plugin details with sizes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      name:
                        type: string
                        example: My Plugin Setting
                      plugin_name:
                        type: string
                        example: Private Plugin
                      state:
                        type: string
                        example: active
                      strategy:
                        type: string
                        nullable: true
                        example: polling
                      transform_runtime:
                        type: string
                        example: serverless
                      serverless_language:
                        type: string
                        nullable: true
                        example: javascript
                      error_message:
                        type: string
                        description: Present only while the instance is failing
                      framework:
                        description: Design system version and asset URLs the markup renders against
                      settings:
                        description: The instance settings, with sensitive values removed
                      form_fields:
                        type: array
                        items:
                          description: A form field definition
                      custom_fields:
                        type: array
                        items:
                          description: A user-defined form field
                      available_fields:
                        description: Fields writable under the current settings
                      sizes:
                        type: object
                        additionalProperties:
                          type: boolean
                        description: Each markup size, and whether markup is attached at it
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: UUID belonging to another user
  /api/plugins:
    get:
      summary: List plugins available to install
      tags:
        - Plugins
      operationId: listPlugins
      description: The published catalog (native and third-party) plus your own
        third-party plugins at any status. Send a plugin id to
        createPluginSetting.
      security:
        - bearer_auth: [ ]
      parameters:
        - name: category
          in: query
          required: false
          description: One of Plugin::CATEGORIES
          schema:
            type: string
        - name: query
          in: query
          required: false
          description: Matches the plugin name
          schema:
            type: string
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Selects a cursor page with items and next_cursor instead of the
            default array
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque cursor bound to this account and filters
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Plugin"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/plugins/{id}:
    get:
      summary: Read a plugin and its form fields
      tags:
        - Plugins
      operationId: getPlugin
      description: form_fields lists what to send updatePluginSettingFields, keyed by
        the same keyname.
      security:
        - bearer_auth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: Plugin id or keyname
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Plugin"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No plugin matches the id or keyname
  /api/recipes:
    get:
      summary: Search published recipes
      tags:
        - Recipes
      operationId: searchRecipes
      description: "Recipes are plugin settings other users published. Use one or two
        keywords, or #category to filter by category."
      security:
        - bearer_auth: [ ]
      parameters:
        - name: query
          in: query
          required: false
          description: "Keywords, or #category"
          schema:
            type: string
        - name: sort_by
          in: query
          required: false
          enum:
            - newest
            - oldest
            - popularity
            - install
            - fork
          schema:
            type: string
          description: ":

            \ * `newest`\ 

            \ * `oldest`\ 

            \ * `popularity`\ 

            \ * `install`\ 

            \ * `fork`\ 

            \ "
        - name: limit
          in: query
          required: false
          description: 1 to 25, default 10
          schema:
            type: integer
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Selects a cursor page with items and next_cursor instead of the
            default array
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque cursor bound to this account and filters
      responses:
        "200":
          description: Lists the newest recipes when no query is given
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Recipe"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/recipes/{id}:
    get:
      summary: Read a recipe and how it installs
      tags:
        - Recipes
      operationId: getRecipe
      description: "install_method says what installRecipe will do: simple_install
        mirrors the author's render; read_only_fork copies the recipe so the
        installer fills its custom fields; oauth_choice is a fork that can also
        carry the author's OAuth connection when inherit_oauth is true."
      security:
        - bearer_auth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: Recipe id
          schema:
            type: integer
      responses:
        "200":
          description: A recipe with custom fields must be forked so the installer can
            fill them
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Recipe"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not a published recipe
  /api/recipes/{id}/markup:
    get:
      summary: Read the markup of a recipe
      tags:
        - Recipes
      operationId: getRecipeMarkup
      description: A starting point for a private plugin of your own; writeMarkup
        takes each size.
      security:
        - bearer_auth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: Recipe id
          schema:
            type: integer
        - name: sizes
          in: query
          required: false
          description: "Comma-separated markup sizes to read, default all: markup_full,
            markup_half_horizontal, markup_half_vertical, markup_quadrant,
            shared_markup"
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      strategy:
                        type: string
                        nullable: true
                      custom_fields:
                        type: array
                        items:
                          type: object
                      markups:
                        type: object
                        additionalProperties:
                          type: string
                        description: Markup by size
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not a published recipe
        "422":
          description: A size that does not exist
  /api/recipes/{id}/installs:
    post:
      summary: Install a recipe
      tags:
        - Recipes
      operationId: installRecipe
      description: Adds the recipe to the account the way getRecipe's install_method
        says, and to the device playlist when a device_id is given.
      security:
        - bearer_auth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: Recipe id
          schema:
            type: integer
      responses:
        "200":
          description: Installs without a playlist when no device is given
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      plugin_setting:
                        $ref: "#/components/schemas/PluginSetting"
                      install_method:
                        type: string
                        enum:
                          - simple_install
                          - read_only_fork
                          - oauth_choice
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not a published recipe
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                device_id:
                  type: integer
                  description: Device whose playlist the install joins
                inherit_oauth:
                  type: boolean
                  description: "For an oauth_choice recipe: carry the author's OAuth connection"
  /api/devices/{device_id}/timeline:
    get:
      summary: Read a device timeline
      tags:
        - Devices
      operationId: getDeviceTimeline
      description: "One day of a device: the check-ins it made (recorded, from
        telemetry) and, on today, the check-ins it will make (expected,
        simulated from its playlist and settings). source narrows both halves to
        one plugin setting or mashup."
      security:
        - bearer_auth: [ ]
      parameters:
        - name: device_id
          in: path
          required: true
          description: Device id
          schema:
            type: integer
        - name: date
          in: query
          required: false
          description: ISO 8601 date in the owner’s time zone, default today; an
            unreadable date reads as today
          schema:
            type: string
        - name: source
          in: query
          required: false
          description: PluginSetting:<id> or Mashup:<id>, one of the account’s own
          schema:
            type: string
        - name: hours
          in: query
          required: false
          enum:
            - 3
            - 12
            - 24
          description: "How far ahead the strip looks, default 24:

            \ * `3`\ 

            \ * `12`\ 

            \ * `24`\ 

            \ "
          schema:
            type: integer
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Timeline"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Source belongs to another user
  /api/plugin_settings/{plugin_setting_id}/timeline:
    get:
      summary: Read a plugin setting timeline
      tags:
        - Plugin Settings
      operationId: getPluginSettingTimeline
      description: "One day of a plugin setting across every device that shows it: the
        check-ins that served it (recorded) and, on today, the ones that will
        (expected), each naming its device."
      security:
        - bearer_auth: [ ]
      parameters:
        - name: plugin_setting_id
          in: path
          required: true
          description: Plugin setting id
          schema:
            type: integer
        - name: date
          in: query
          required: false
          description: ISO 8601 date in the owner’s time zone, default today
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Timeline"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Plugin setting belongs to another user
  /api/mashups/{mashup_id}/timeline:
    get:
      summary: Read a mashup timeline
      tags:
        - Mashups
      operationId: getMashupTimeline
      description: "One day of a mashup across every device that shows it: the
        check-ins that served it (recorded) and, on today, the ones that will
        (expected), each naming its device."
      security:
        - bearer_auth: [ ]
      parameters:
        - name: mashup_id
          in: path
          required: true
          description: Mashup id
          schema:
            type: integer
        - name: date
          in: query
          required: false
          description: ISO 8601 date in the owner’s time zone, default today
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Timeline"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Mashup belongs to another user
  /api/user_themes:
    get:
      summary: List my themes
      tags:
        - User Themes
      operationId: listUserThemes
      description: Requires the theme builder to be enabled for the account.
      security:
        - bearer_auth: [ ]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserTheme"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The theme builder is not enabled for the account
    post:
      summary: Create a theme
      tags:
        - User Themes
      operationId: createUserTheme
      description: "Requires the theme builder to be enabled for the account. settings
        is validated the same way the theme builder validates it: a value
        outside the vocabulary (an unrecognized token, surface, hue, or advanced
        channel) answers 422; a key the recipe does not read is ignored.
        advanced is either a mapping (channels/slots restated on one token) or
        the same mapping as YAML text."
      security:
        - bearer_auth: [ ]
      parameters: [ ]
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UserTheme"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Rejects advanced YAML that does not parse
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Unique per account
                settings:
                  $ref: "#/components/schemas/UserThemeSettings"
              required:
                - name
        required: true
  /api/user_themes/{id}:
    get:
      summary: Read a theme
      tags:
        - User Themes
      operationId: getUserTheme
      description: scss is the framework stylesheet this theme exports, the same file
        the builder downloads. Requires the theme builder to be enabled for the
        account.
      security:
        - bearer_auth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: Theme id
          schema:
            type: integer
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UserTheme"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Theme belongs to another user
    patch:
      summary: Update a theme
      tags:
        - User Themes
      operationId: updateUserTheme
      description: Requires the theme builder to be enabled for the account.
      security:
        - bearer_auth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: Theme id
          schema:
            type: integer
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UserTheme"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Theme belongs to another user
        "422":
          description: Rejects settings outside the recipe vocabulary
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                settings:
                  $ref: "#/components/schemas/UserThemeSettings"
        required: true
    delete:
      summary: Delete a theme
      tags:
        - User Themes
      operationId: deleteUserTheme
      description: Requires the theme builder to be enabled for the account.
      security:
        - bearer_auth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: Theme id
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Theme belongs to another user
  /api/user_themes/imports:
    post:
      summary: Create a theme from a shared theme snippet
      tags:
        - User Themes
      operationId: importUserTheme
      description: Decodes a /t/:token share link (the "Copy share link" button on a
        theme) through the same settings parse createUserTheme uses, and saves
        it under name. Requires the theme builder to be enabled for the account.
      security:
        - bearer_auth: [ ]
      parameters: [ ]
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UserTheme"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The theme builder is not enabled for the account
        "422":
          description: name is missing
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: The token from a /t/:token share link, with or without the URL
                    around it
                name:
                  type: string
                  description: Unique per account
              required:
                - token
                - name
        required: true
servers:
  - url: https://{defaultHost}
    variables:
      defaultHost:
        default: trmnl.com
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: API key or OAuth access token
  schemas:
    PluginConnectionAttempt:
      type: object
      required:
        - id
        - state
        - expires_at
        - connection_id
        - target
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum:
            - pending
            - exchanging
            - exchanged
            - connected
            - denied
            - failed
            - expired
            - cancelled
        expires_at:
          type: string
          format: date-time
        connection_id:
          type: string
        launch_url:
          type: string
          format: uri
        target:
          type: object
          required:
            - kind
            - id
          properties:
            kind:
              type: string
              enum:
                - instance
                - installation
            id:
              oneOf:
                - type: integer
                - type: string
                  format: uuid
    CatalogEntry:
      type: object
      required:
        - kind
        - id
        - name
        - description
        - categories
      properties:
        kind:
          type: string
          enum:
            - official
            - recipe
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        categories:
          type: array
          items:
            type: string
        source_revision:
          type: string
        requirements:
          type: array
          items:
            type: string
        compatibility:
          type: object
        install_choices:
          type: array
          items:
            type: object
            required:
              - id
              - label
              - requirements
            properties:
              id:
                type: string
              label:
                type: string
              help:
                type: string
              requirements:
                type: array
                items:
                  type: string
    PluginInstallation:
      type: object
      required:
        - id
        - state
        - source
        - plugin_setting_id
        - expires_at
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum:
            - setup_required
            - ready
            - completed
            - cancelled
            - expired
            - removed
        source:
          type: object
          required:
            - kind
            - id
            - revision
            - choice_id
          properties:
            kind:
              type: string
            id:
              type: integer
            revision:
              type: string
            choice_id:
              type: string
            device_id:
              type: integer
        plugin_setting_id:
          type: integer
          nullable: true
        expires_at:
          type: string
          format: date_time
    ConfigurationField:
      type: object
      required:
        - path
        - type
        - label
        - required
        - read_only
        - nullable
        - constraints
      properties:
        path:
          type: string
          pattern: ^/values/
        type:
          type: string
        label:
          type: string
        help:
          type: string
        required:
          type: boolean
        read_only:
          type: boolean
        nullable:
          type: boolean
        constraints:
          type: object
        choices:
          oneOf:
            - type: array
              items:
                type: object
                required:
                  - label
                  - value
                properties:
                  label:
                    type: string
                  value: { }
            - type: object
              required:
                - resolver_id
                - depends_on
                - searchable
                - paginated
              properties:
                resolver_id:
                  type: string
                depends_on:
                  type: array
                  items:
                    type: string
                searchable:
                  type: boolean
                paginated:
                  type: boolean
    PluginSync:
      type: object
      required:
        - source_kinds
        - upload_allowed
      properties:
        source_kinds:
          type: array
          items:
            type: string
        upload_allowed:
          type: boolean
        reason:
          type: string
          nullable: true
        action_id:
          type: string
          nullable: true
    PluginConfiguration:
      type: object
      required:
        - schema_version
        - revision
        - required_capabilities
        - sections
        - values
        - secrets
        - connections
        - actions
        - readiness
        - sync
      properties:
        schema_version:
          type: integer
          enum:
            - 1
        revision:
          type: string
        required_capabilities:
          type: array
          items:
            type: string
        sections:
          type: array
          items:
            type: object
            required:
              - id
              - title
              - fields
            properties:
              id:
                type: string
              title:
                type: string
              fields:
                type: array
                items:
                  $ref: "#/components/schemas/ConfigurationField"
        values:
          type: object
          description: Only declared nonsecret values. Secret values are never returned.
        secrets:
          type: object
          additionalProperties:
            type: object
            required:
              - present
            properties:
              present:
                type: boolean
        connections:
          type: array
          items:
            type: object
        actions:
          type: array
          items:
            type: object
        readiness:
          type: object
          required:
            - ready
            - blocking_paths
          properties:
            ready:
              type: boolean
            blocking_paths:
              type: array
              items:
                type: string
            reason:
              type: string
              nullable: true
        sync:
          $ref: "#/components/schemas/PluginSync"
    ConfigurationChange:
      type: object
      required:
        - op
        - path
      additionalProperties: false
      properties:
        op:
          type: string
          enum:
            - set
            - unset
            - clear_secret
        path:
          type: string
          pattern: ^/values/
        value: { }
    ConfigurationWrite:
      type: object
      required:
        - revision
        - changes
      properties:
        revision:
          type: string
        changes:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/ConfigurationChange"
    ConfigurationError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - field_errors
          properties:
            code:
              type: string
            message:
              type: string
            field_errors:
              type: array
              items:
                type: object
                required:
                  - path
                  - code
                  - message
                properties:
                  path:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
    MashupOptions:
      type: object
      required:
        - layouts
        - plugins
      properties:
        layouts:
          type: array
          items:
            type: object
            required:
              - id
              - name
              - columns
              - rows
              - sections
            properties:
              id:
                type: string
              name:
                type: string
              columns:
                type: integer
              rows:
                type: integer
              sections:
                type: array
                items:
                  type: object
                  required:
                    - position
                    - column
                    - row
                    - column_span
                    - row_span
                  properties:
                    position:
                      type: string
                    column:
                      type: integer
                    row:
                      type: integer
                    column_span:
                      type: integer
                    row_span:
                      type: integer
        plugins:
          type: array
          items:
            type: object
            required:
              - id
              - name
              - plugin_name
              - compatible_layouts
            properties:
              id:
                type: integer
              name:
                type: string
              plugin_name:
                type: string
              compatible_layouts:
                type: array
                items:
                  type: string
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
          example: An error occurred
    Device:
      type: object
      additionalProperties: false
      properties:
        management:
          type: object
        id:
          type: integer
          example: 123
        name:
          type: string
          example: My TRMNL
        friendly_id:
          type: string
          example: ABC-123
        mac_address:
          type: string
          example: ••:••:••:••:9A:BC
          description: All but the last two bytes are masked for an API key or an agent;
            the account API key reads it whole.
        firmware_version:
          type: string
          nullable: true
          example: 1.8.14
          description: Version the device reported at its last check-in
        firmware_channel:
          type: string
          example: production
          description: Release channel the device follows
        ota_enabled:
          type: boolean
          example: true
          description: Whether the device accepts over-the-air updates
        pinned_firmware_version:
          type: string
          nullable: true
          example: 1.8.14
          description: Version the device is pinned to, if any
        battery_voltage:
          type: number
          nullable: true
          example: 3.7
        rssi:
          type: integer
          nullable: true
          example: -70
        wifi_band:
          type: string
          nullable: true
          example: "5"
          description: WiFi band the device is connected on ("2.4" or "5")
        refresh_interval:
          type: integer
          example: 900
          description: Seconds between check-ins, 300 to 86400
        orientation:
          type: integer
          example: 0
        sleep_screen_enabled:
          type: boolean
          example: true
        low_battery_notification_enabled:
          type: boolean
          example: true
        sleep_mode_enabled:
          type: boolean
          nullable: false
          example: false
        sleep_start_time:
          type: integer
          example: 1320
        sleep_end_time:
          type: integer
          example: 480
        sleep_until:
          type: string
          format: date_time
          nullable: true
          example: 2026-10-01T15:00:00.000Z
          description: A one-time sleep the device takes at its next check-in, then clears
        last_ping_at:
          type: string
          format: date_time
          nullable: true
          example: 2026-03-31T14:30:00.000Z
        hardware_last_ping_at:
          type: string
          format: date_time
          nullable: true
          example: 2026-03-31T14:30:00.000Z
        percent_charged:
          type: number
          example: 85
          minimum: 0
          maximum: 100
        wifi_strength:
          type: number
          example: 75
          minimum: 0
          maximum: 100
        mashup_layouts:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            1Lx1R:
              - a
              - b
            2x2:
              - a
              - b
              - c
              - d
          description: The mashup layouts the device can show and the positions to fill in
            each; 3x3 lists none because its grid_config names them
    Model:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          example: trmnl_original
          description: Unique identifier
        label:
          type: string
          example: TRMNL
          description: Human-readable name
        description:
          type: string
          example: Original TRMNL model
          description: Description
        width:
          type: integer
          example: 800
          description: Screen width in pixels
        height:
          type: integer
          example: 480
          description: Screen height in pixels
        colors:
          type: integer
          example: 2
          description: Number of colors supported
        bit_depth:
          type: integer
          example: 1
          description: Color bit depth
        scale_factor:
          type: number
          example: 1
          description: Display scale factor
        rotation:
          type: integer
          example: 90
          description: Screen rotation in degrees
        mime_type:
          type: string
          example: image/png
          description: Image MIME type
        offset_x:
          type: integer
          example: 10
          description: X offset for image rendering
        offset_y:
          type: integer
          example: 20
          description: Y offset for image rendering
        kind:
          type: string
          example: trmnl
          description: Device kind (e.g., trmnl, kindle, byod)
          enum:
            - trmnl
            - kindle
            - byod
            - tidbyt
        palette_ids:
          type: array
          items:
            type: string
          example:
            - bw
            - gray-4
            - gray-16
          description: Supported color palette IDs
        preview_white_point:
          type: string
          example: true_white
          description: Preview white point mode for color previews
          enum:
            - true_white
            - limited
        image_size_limit:
          type: integer
          nullable: true
          example: 90000
          description: Maximum image file size in bytes for webhook uploads; null means
            the model declares no limit
        image_upload_supported:
          type: boolean
          example: true
          description: Whether webhook image uploads are supported for this device type
        css:
          type: object
          nullable: true
          description: CSS classes and variables for web rendering
          properties:
            classes:
              type: object
              properties:
                device:
                  type: string
                  example: screen--og_plus
                size:
                  type: string
                  example: screen--md
                density:
                  type: string
                  example: screen--density-1x
            variables:
              type: array
              items:
                type: array
                items:
                  type: string
                example:
                  - --screen-w
                  - 800px
    Palette:
      type: object
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          type: string
          example: gray-16
          description: Unique identifier
        name:
          type: string
          example: 16-Gray
          description: Human-readable name
        grays:
          type: integer
          nullable: true
          example: 16
          description: Number of grayscale levels (null for color palettes)
        colors:
          type: array
          nullable: true
          items:
            type: string
          example:
            - "#FF0000"
            - "#00FF00"
            - "#0000FF"
            - "#FFFF00"
            - "#000000"
            - "#FFFFFF"
          description: Array of hex color codes (null for grayscale palettes)
        framework_class:
          type: string
          example: screen--4bit
          description: Framework CSS class for this palette
        grayscale_bit_depth:
          type: integer
          nullable: true
          example: 1
          description: For color palettes, bit depth for grayscale areas (1 for 3/4-color
            limited, 2 for 6/7-color, 4 for full-spectrum)
    PlaylistItem:
      type: object
      additionalProperties: false
      properties:
        presentation:
          type: object
        created_at:
          type: string
          format: date_time
          example: 2023-10-01T12:00:00Z
        configuration_state:
          type: string
          example: configured
