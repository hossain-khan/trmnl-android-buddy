            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/apps/fleet/{installation_id}/pushes:
    parameters:
      - name: installation_id
        in: path
        description: Fleet installation id
        required: true
        schema:
          type: string
    post:
      summary: Push the master playlist to every mirror
      tags:
        - Apps - Fleet
      operationId: pushFleet
      description: Queues one push for the whole fleet. Each mirror gets a copy of the
        master playlist and the inherited settings.
      security:
        - bearer_auth: [ ]
      responses:
        "202":
          description: Queued
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Installation belongs to another user
        "422":
          description: No master device
        "429":
          description: The fleet has had its hourly pushes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/apps/fleet/{installation_id}/settings:
    parameters:
      - name: installation_id
        in: path
        description: Fleet installation id
        required: true
        schema:
          type: string
    patch:
      summary: Choose the settings mirrors inherit from the master
      tags:
        - Apps - Fleet
      operationId: updateFleetSettings
      description: Replaces the list. Each push copies these settings from the master;
        an empty list copies the playlist only.
      security:
        - bearer_auth: [ ]
      parameters: [ ]
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Fleet"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Installation belongs to another user
        "422":
          description: A setting that cannot be inherited
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                inherited_settings:
                  type: array
                  items:
                    type: string
                    enum:
                      - refresh_interval
                      - orientation
                      - sleep
                      - palette
              required:
