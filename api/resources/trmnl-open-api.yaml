      parameters:
        - name: item_id
          in: path
          required: true
          description: Playlist item id
          schema:
            type: integer
      responses:
        "200":
          description: Reports an item with no windows as always active
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      week_schedules:
                        type: array
                        items:
                          type: object
                          properties:
                            week_days:
                              type: array
                              items:
                                type: integer
                              description: 0 is Sunday through 6 is Saturday
                            start_time:
                              type: string
                              example: 09:00
                            end_time:
                              type: string
                              example: 17:00
                      always_active:
                        type: boolean
                        example: false
                        description: True when no window is set, so the item always displays
