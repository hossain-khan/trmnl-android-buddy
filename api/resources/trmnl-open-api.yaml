    parameters:
      - name: installation_id
        in: path
        description: Room booking installation id
        required: true
        schema:
          type: string
      - name: integration_type
        in: path
        enum:
          - google_user
          - google_workspace
          - microsoft_user
          - microsoft_workspace
        required: true
        schema:
          type: string
    get:
      summary: Where to send the owner to connect an account
      tags:
        - Apps - Room Booking
      operationId: getRoomBookingIntegrationConnectUrl
      description: "Connecting needs the owner to consent at Google or Microsoft in a
        browser, signed in to TRMNL. The answer is the form action that starts
        it: an HTML form the owner submits with the given method, from a TRMNL
        page (it is CSRF-protected)."
      security:
        - bearer_auth: [ ]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
