openapi: 3.0.1
info:
  title: TRMNL API
  version: "1"
  description: >
    Send an account API key, or the access token of an app a user connected with
    OAuth, as a bearer

    token. Create a key on your account settings page and pick what it may do:
    read,

    content, devices, delete, profile or apps; an app asks for the same scopes
    and the user

    picks them (see https://trmnl.com/auth.md). An operation outside

    them answers 403 naming the capability it needs. A key can also be limited
    to some

    devices and plugin settings, and then answers 403 naming what it was not
    granted. The

    legacy account API key reaches only the endpoints it always had, and answers
    403 on the

    rest.


    This is a plain OpenAPI 3 document, so a client can be generated from it, or
    read

    straight off it at runtime. The TRMNL CLI (https://github.com/usetrmnl/cli)
    takes the second

    route, so every operation here is a command. It signs in through your
    browser, no key needed:


    ```

    brew install usetrmnl/tap/trmnl

    trmnl list-devices

    ```


    To build a plugin, use trmnlp instead: https://github.com/usetrmnl/trmnlp.
    It serves

    your markup locally with live reload and syncs it with your account.


    Over MCP (https://trmnl.com/mcp) an agent runs these same operations as
    account

    tools. An OAuth connection holds the capabilities its user ticked at consent
    (read,

    content, devices, delete, profile) and may be limited to some devices and
    plugin

    settings; an operation outside them answers 403 naming what is missing. See

    https://trmnl.com/auth.md.
paths:
  /api/display:
    get:
      summary: Fetch the next screen
      operationId: getDisplay
      tags:
        - Device API
      x-cli-ignore: true
      parameters:
        - name: Access-Token
          in: header
          required: true
          description: Device API Key (eg. abc-123)
          schema:
            type: string
        - name: Battery-Voltage
          in: header
          required: false
          description: Device battery voltage (eg. 3.7)
          schema:
            type: number
        - name: Percent-Charged
          in: header
          required: false
          description: Device percent charged (eg. 69.4)
          schema:
            type: number
        - name: Battery-Count
          in: header
          required: false
          description: Number of batteries in device (e.g. 1-2)
          schema:
            type: number
        - name: Battery-Charging
          in: header
          required: false
          description: Whether device is plugged into power (eg. true)
          schema:
            type: number
        - name: Battery-Health
          in: header
          required: false
          description: Quality of battery (eg. -1-100)
          schema:
            type: number
        - name: Battery-Current
          in: header
          required: false
          description: Battery current (eg. -1-N)
          schema:
            type: number
        - name: Battery-Temp
          in: header
          required: false
          description: Battery temperature in celsius (eg. -1-N)
          schema:
            type: number
        - name: Battery-Capacity
          in: header
          required: false
          description: Ratio of current / max capacity (eg. -1/-1 in fault case)
          schema:
            type: number
        - name: USB-Connected
          in: header
          required: false
          description: Whether device is plugged into power via USB ("true" or "false")
          schema:
            type: string
        - name: WiFi-Band
          in: header
          required: false
          description: WiFi band the device is connected on ("2.4" or "5")
          schema:
            type: string
        - name: Panel-Rev
          in: header
          required: false
          description: Identifier of the ePaper panel fitted to the device
          schema:
            type: string
        - name: FW-Version
          in: header
          required: false
          description: Device firmware version (eg. 0.0.1)
          schema:
            type: string
        - name: FW-Commit
          in: header
          required: false
          description: Device firmware commit hash, for the development channel (eg.
            a14914c)
          schema:
            type: string
        - name: RSSI
          in: header
          required: false
          description: Device RSSI (eg. -69)
          schema:
            type: number
        - name: Height
          in: header
          required: false
          description: Device screen height (eg. 480)
          schema:
            type: string
        - name: Width
          in: header
          required: false
          description: Device screen width (eg. 800)
          schema:
            type: string
        - name: Special-Function
          in: header
          required: false
          description: Device special function (eg. true)
          schema:
            type: boolean
        - name: BASE64
          in: header
          required: false
          description: Encode image function (eg. true)
          schema:
            type: boolean
        - name: Sensors
          in: header
          required: false
          description: Environmental sensor data
          schema:
            type: string
        - name: Image-Cached
          in: header
          required: false
          description: Whether the device served the previous image from cache (eg. true /
            false)
          schema:
            type: string
        - name: Wake-Time
          in: header
          required: false
          description: Seconds the device was awake during the last cycle (eg. 12)
          schema:
            type: integer
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  image_url:
                    type: string
                    nullable: true
                    example: https://trmnl.com/images/system_screens/setup_logo/og_plus.png
                  filename:
                    type: string
                    nullable: true
                    example: setup-logo.bmp
                  refresh_rate:
                    type: integer
                    example: 300
                  reset_firmware:
                    type: boolean
                    example: false
                  update_firmware:
                    type: boolean
                    example: false
                  firmware_url:
                    type: string
                    nullable: true
                    example: https://trmnl.com/firmware/1.0.0.bin
                  special_function:
                    type: string
                    nullable: false
                    example: identify
                  action:
                    type: string
                    nullable: true
                    example: identify
  /api/display/current:
    get:
      summary: Fetch the current screen
      operationId: getCurrentScreen
      tags:
        - Device API
      x-cli-ignore: true
      parameters:
        - name: Access-Token
          in: header
          required: true
          description: Device API Key (eg. abc-123)
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  refresh_rate:
                    type: integer
                    example: 300
                  image_url:
                    type: string
                    nullable: true
                    example: https://trmnl.com/images/system_screens/setup_logo/og_plus.png
                  filename:
                    type: string
                    nullable: true
                    example: setup-logo.bmp
                  rendered_at:
                    type: string
                    nullable: true
                    example: 2023-01-01T00:00:00Z
  /api/log:
    post:
      summary: Log with logs[] (array)
      operationId: createDeviceLog
      tags:
        - Device API
      x-cli-ignore: true
      parameters:
        - name: Access-Token
          in: header
          required: true
          description: Device API Key (eg. abc-123)
          schema:
            type: string
      responses:
        "204":
          description: Logs created when ignore_log_messages is not set
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                logs:
                  type: array
                  items: { }
              required:
                - logs
              additionalProperties: false
        required: true
        description: "An array of log entries. Each entry can be any JSON type: string,
          object, etc."
  /api/setup:
    get:
      summary: Set up device
      operationId: setupDevice
      tags:
        - Device API
      x-cli-ignore: true
      parameters:
        - name: ID
          in: header
          required: true
          description: Device MAC Address (eg. 41:B4:10:39:A1:24)
          schema:
            type: string
        - name: Model
          in: header
          required: true
          description: DEVICE_MODEL from firmware definitions
          schema:
            type: string
        - name: Panel-Rev
          in: header
          required: false
          description: Identifier of the ePaper panel fitted to the device
          schema:
            type: string
      description: >
        Please note that the returned `status` JSON value may NOT always equal
        the HTTP status code. Notably, if a device MAC address is not found,

        then the HTTP status code will be 200 but the `status` code in the
        response will be 404.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  api_key:
                    type: string
                    nullable: true
                    example: abc-123
                  friendly_id:
                    type: string
                    nullable: true
                    example: ABC-123
                  image_url:
                    type: string
                    nullable: true
                    example: https://trmnl.com/images/system_screens/setup_logo/og_plus.png
                  message:
                    type: string
                    example: Register at trmnl.com/start with Device ID 'ABC-123'
  /api/categories:
    get:
      summary: List all plugin categories
      operationId: listCategories
      tags:
        - Categories
      description: Returns a list of approved plugin categories.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: string
                    example:
                      - life
                      - marketing
                      - ecommerce
  /api/firmware/flash:
    get:
      summary: List flashable firmware versions per device model
      operationId: listFlashFirmwares
      tags:
        - Flash Firmwares
      description: |
        Firmware builds flashable via the TRMNL web flasher (/flash).
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      models:
                        type: array
                        items:
                          type: object
                          properties:
                            keyname:
                              type: string
                            chipFamily:
                              type: string
                            label:
                              type: string
                            versions:
                              type: array
                              items:
                                type: object
                                properties:
                                  version:
                                    type: string
                                  url:
                                    type: string
                                required:
                                  - version
                                  - url
                          required:
                            - keyname
                            - chipFamily
                            - label
                            - versions
                    required:
                      - models
                required:
                  - data
  /api/ips:
    get:
      summary: List all TRMNL server IP addresses
      operationId: listServerIps
      tags:
        - Server IPs
      description: |
        Returns a list of public IP addresses for all TRMNL core servers.

        Plugin poll requests will only originate from these IPs.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ipv4:
                        type: array
                        items:
                          type: string
                      ipv6:
                        type: array
                        items:
                          type: string
  /api/markup:
    post:
      summary: Render Liquid template
      operationId: renderMarkup
      tags:
        - Markup
      parameters: [ ]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                markup:
                  oneOf:
                    - type: string
                      example: Hello, {{ name }}!
                    - type: array
                      items:
                        type: string
                      example:
                        - Hello, {{ name }}!
                        - Goodbye, {{ name }}!
                variables:
                  type: object
                  example:
                    name: World
              required:
                - markup
                - variables
              additionalProperties: false
        required: true
        description: The Liquid markup(s) to render and an optional set of variables to
          use in the rendering process.
  /api/models:
    get:
      summary: List all device models
      operationId: listModels
      tags:
        - Models
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Model"
  /api/palettes:
    get:
      summary: List all palettes
      operationId: listPalettes
      tags:
        - Palettes
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Palette"
  /api/book/{token}/events:
    parameters:
      - name: token
        in: path
        description: The room public booking token, from its QR code or public_booking_token
        required: true
        schema:
          type: string
    get:
      summary: List the bookings a walk-up visitor sees
      tags:
        - Public booking
      operationId: listPublicBookingEvents
      description: "Public: no bearer token, so it is not an account operation and no
        agent tool offers it. The rolling week from start_at, as the walk-up
        page shows it, with times in the room time zone. A collection token also
        takes resource_type and resource_id to pick one of its rooms."
      parameters:
        - name: start_at
          in: query
          required: true
          description: Window start, ISO 8601 or YYYY-MM-DDTHH:MM in the room time zone
          schema:
            type: string
        - name: resource_type
          in: query
          required: false
          enum:
            - ical
            - google
            - microsoft
          description: "Collection tokens only:

            \ * `ical`\ 

            \ * `google`\ 

            \ * `microsoft`\ 

            \ "
          schema:
            type: string
        - name: resource_id
          in: query
          required: false
          description: Collection tokens only
          schema:
            type: integer
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicBookingEvent"
                  bookingLimit:
                    type: integer
                    description: How many bookings may overlap; more than one for a desk pool
                  fetched_at:
                    type: string
                    format: date_time
                    nullable: true
        "400":
          description: start_at is missing
        "410":
          description: "Unknown token, walk-up booking off, or a room that cannot be
            booked: all look the same"
  /api/book/{token}/bookings:
    parameters:
      - name: token
        in: path
        description: The room public booking token
        required: true
        schema:
          type: string
    post:
      summary: Book a room as a walk-up visitor
      tags:
        - Public booking
      operationId: createPublicBooking
      description: "Public: no bearer token. The same rules as the walk-up page:
        within the room booking window, ending before midnight, and on an
        on-demand room duration_minutes (15, 30 or 60) from now instead of
        times. The title is capped and defaults when blank. Limited per token."
      parameters:
        - name: resource_type
          in: query
          required: false
          description: Collection tokens only
          schema:
            type: string
        - name: resource_id
          in: query
          required: false
          description: Collection tokens only
          schema:
            type: integer
      responses:
        "200":
          description: Booked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PublicBookingEvent"
        "409":
          description: The slot was just taken
        "410":
          description: "Unknown token, walk-up booking off, or a room that cannot be
            booked: all look the same"
        "422":
          description: Outside the booking window
        "429":
          description: Too many bookings from one token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  nullable: true
                starts_at:
                  type: string
                  description: ISO 8601, or YYYY-MM-DDTHH:MM in the room time zone
                ends_at:
                  type: string
                duration_minutes:
                  type: integer
                  enum:
                    - 15
                    - 30
                    - 60
                  description: On-demand rooms only
        required: true
  /api/book/{token}/bookings/{id}:
    parameters:
      - name: token
        in: path
        description: The room public booking token
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: Booking id
        required: true
        schema:
          type: integer
    delete:
      summary: Cancel an upcoming walk-up booking
      tags:
        - Public booking
      operationId: cancelPublicBooking
      description: "Public: no bearer token. Only a booking made through TRMNL that
        has not started."
      responses:
        "204":
          description: Canceled
        "404":
          description: A booking made outside TRMNL, or one on another room
        "410":
          description: "Unknown token, walk-up booking off, or a room that cannot be
            booked: all look the same"
  /api/book/{token}/bookings/{id}/end:
    parameters:
      - name: token
        in: path
        description: The room public booking token
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: Booking id
        required: true
        schema:
          type: integer
    patch:
      summary: End a walk-up booking in progress
      tags:
        - Public booking
      operationId: endPublicBooking
      description: "Public: no bearer token. Frees the room now; only a booking made
        through TRMNL that is in progress."
      responses:
        "200":
          description: Ended
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PublicBookingEvent"
        "404":
          description: A booking that has not started
        "410":
          description: "Unknown token, walk-up booking off, or a room that cannot be
            booked: all look the same"
  /api/analytics:
    get:
      summary: Read the analytics of the plugins you published
      tags:
        - Analytics
      operationId: getAuthorAnalytics
      description: Each recipe and third-party plugin you published with its installs,
        forks and health, the totals, the share of live installs in each health
        state and a 90-day install growth series.
      security:
        - bearer_auth: [ ]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      plugins:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            state:
                              type: string
                              nullable: true
                              enum:
                                - healthy
                                - degraded
                                - erroring
                                - null
                            installs:
                              type: integer
                            forks:
                              type: integer
                      stats:
                        type: object
                        properties:
                          plugins:
                            type: integer
                          connections:
                            type: integer
                          pageviews:
                            type: integer
                      health:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            percent:
                              type: number
                              nullable: true
                        description: healthy, degraded and erroring as a share of live installs
                      growth:
                        type: array
                        items:
                          type: array
                          items: { }
                          description: "[date, installs to date]"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/analytics/errors:
    get:
      summary: List the failing installs of the plugins you published
      tags:
        - Analytics
      operationId: listAuthorPluginErrors
      description: "One row per distinct error message still failing in the last week,
        with who can act on it: author (your plugin), upstream (the data
        source), installer_connection or installer_setup. Rows you hid stay
        listed with hidden true."
      security:
        - bearer_auth: [ ]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        kind:
                          type: string
                          enum:
                            - recipe
                            - third_party
                        subject_id:
                          type: integer
                        plugin_name:
                          type: string
                          nullable: true
                        owner:
                          type: string
                          enum:
                            - author
                            - upstream
                            - installer_connection
                            - installer_setup
                        message:
                          type: string
                        count:
                          type: integer
                        last_seen:
                          type: string
                          format: date_time
                        hidden:
                          type: boolean
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/analytics/hidden_errors:
    post:
      summary: Hide an error row from your analytics
      tags:
        - Analytics
      operationId: hideAuthorPluginError
      description: Takes the kind, subject_id, owner and message of a
        listAuthorPluginErrors row. The row stops showing on the dashboard and
        in the emails about it; unhideAuthorPluginError puts it back.
      security:
        - bearer_auth: [ ]
      parameters: [ ]
      responses:
        "200":
          description: Hidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      hidden:
                        type: boolean
                        example: true
        "400":
          description: A field of the key is missing
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: A kind that is not recipe or third_party
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum:
                    - recipe
                    - third_party
                subject_id:
                  type: integer
                  description: The recipe or third-party plugin id of the row
                owner:
                  type: string
                  enum:
                    - author
                    - upstream
                    - installer_connection
                    - installer_setup
                message:
                  type: string
                  description: The row message; it is matched by shape, so numbers and urls in it
                    may differ
              required:
                - kind
                - subject_id
                - owner
                - message
        required: true
    delete:
      summary: Show a hidden error row again
      tags:
        - Analytics
      operationId: unhideAuthorPluginError
      description: Takes the same kind, subject_id, owner and message that hid the row.
      security:
        - bearer_auth: [ ]
      parameters:
        - name: kind
          in: query
          required: true
          enum:
            - recipe
            - third_party
          schema:
            type: string
          description: ":\n * `recipe`\ \n * `third_party`\ \n "
        - name: subject_id
          in: query
          required: true
          schema:
            type: integer
        - name: owner
          in: query
          required: true
          enum:
            - author
            - upstream
            - installer_connection
            - installer_setup
          schema:
            type: string
        - name: message
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shown again
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      hidden:
                        type: boolean
                        example: false
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/analytics/uninstall_feedback:
    get:
      summary: Read why installers removed the plugins you published
      tags:
        - Analytics
      operationId: listUninstallFeedback
      description: "The last 30 days of uninstall feedback across everything you
        published: the total, a count per reason, the latest written comments
        and the typical days installed. Never names the installer."
      security:
        - bearer_auth: [ ]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      window_days:
                        type: integer
                        example: 30
                      total:
                        type: integer
                      reason_breakdown:
                        type: array
                        items:
                          type: array
                          items: { }
                          description: "[reason, count]"
                      recent_comments:
                        type: array
                        items:
                          type: object
                          properties:
                            detail:
                              type: string
                            plugin_name:
                              type: string
                            reason_label:
                              type: string
                              nullable: true
                            kind_label:
                              type: string
                              nullable: true
                            created_at:
                              type: string
                              format: date_time
                      typical_days_installed:
                        type: integer
                        nullable: true
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/apps/fleet/{installation_id}:
