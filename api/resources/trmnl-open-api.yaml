  /api/apps/room_booking/{installation_id}/calendars/{id}/bookings:
    parameters:
      - name: installation_id
        in: path
        description: Room booking installation id
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: Calendar id
        required: true
        schema:
          type: string
    get:
      summary: List the bookings of a calendar
      tags:
        - Apps - Room Booking
      operationId: listRoomBookings
      description: Confirmed bookings in a window, soonest first. The window defaults
        to the next seven days.
      security:
        - bearer_auth: [ ]
      parameters:
        - name: from
          in: query
          format: date-time
          required: false
          description: Window start; now when left out
          schema:
            type: string
        - name: to
          in: query
          format: date-time
          required: false
          description: Window end; seven days after from when left out
          schema:
            type: string
        - name: status
          in: query
          enum:
            - confirmed
            - cancelled
          required: false
          description: "confirmed when left out:

            \ * `confirmed`\ 

            \ * `cancelled`\ 

            \ "
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RoomBooking"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Installation belongs to another user
        "422":
          description: A window that ends before it starts
    post:
      summary: Book a room
      tags:
        - Apps - Room Booking
      operationId: createRoomBooking
      description: Books the slot on the room calendar as the owner. Times are ISO
        8601; a time without a zone is read in the calendar time zone. An iCal
        calendar is read-only and refuses; an overlap answers 409.
      security:
        - bearer_auth: [ ]
      parameters: [ ]
      responses:
        "200":
          description: Booked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/RoomBooking"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "402":
          description: Billing is locked until the subscription is settled
        "404":
          description: Installation belongs to another user
        "409":
          description: The slot overlaps a confirmed booking
        "422":
          description: Ends before it starts
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  nullable: true
                starts_at:
                  type: string
                  format: date-time
                ends_at:
                  type: string
                  format: date-time
              required:
                - starts_at
                - ends_at
        required: true
